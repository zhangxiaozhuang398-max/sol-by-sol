<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260">
  <!-- Survey site "Red Dunes": crescent (barchan) dunes and a weather mast. An illustration placed on the photo,
       larger than life. The wind and the sun both come from the west (left): gentle sunlit slopes face west,
       the steep slip faces on the east are in shade, and the horns point downwind. -->
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <radialGradient id="apron">
      <stop offset="0" stop-color="#9a5a3c" stop-opacity="0.42"/><stop offset="0.65" stop-color="#9a5a3c" stop-opacity="0.2"/><stop offset="1" stop-color="#9a5a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d59a70"/><stop offset="0.55" stop-color="#b9774f"/><stop offset="1" stop-color="#8f5236"/>
    </linearGradient>
    <g id="barchan">
      <path d="M92 -76 C-150 -120 -150 120 92 76 C-22 56 -22 -56 92 -76 Z" fill="#2a140b" opacity="0.4" filter="url(#blur)" transform="translate(14 4)"/>
      <path d="M92 -76 C-150 -120 -150 120 92 76 C-22 56 -22 -56 92 -76 Z" fill="url(#sand)"/>
      <path d="M92 -76 C-22 -56 -22 56 92 76 C12 50 12 -50 92 -76 Z" fill="#3a1c10" opacity="0.5" filter="url(#haze)"/>
      <g fill="none" stroke="#f0c39c" stroke-width="2" stroke-linecap="round" opacity="0.5">
        <path d="M-70 -36 C-86 -12 -86 12 -70 36"/><path d="M-50 -52 C-70 -18 -70 18 -50 52"/><path d="M-28 -60 C-50 -20 -50 20 -28 60"/>
      </g>
    </g>
  </defs>

  <ellipse cx="160" cy="130" rx="158" ry="128" fill="url(#apron)"/>
  <!-- wind ripples in the sand between the dunes -->
  <g fill="none" stroke="#7d4a32" stroke-width="1.6" stroke-linecap="round" opacity="0.35">
    <path d="M40 150 q10 -8 20 0 t20 0 t20 0"/><path d="M30 170 q10 -8 20 0 t20 0 t20 0 t20 0"/><path d="M222 60 q10 -8 20 0 t20 0 t20 0"/>
    <path d="M150 226 q10 -8 20 0 t20 0 t20 0 t20 0"/><path d="M96 36 q10 -8 20 0 t20 0"/>
  </g>

  <use href="#barchan" transform="translate(106 86) scale(0.62)"/>
  <use href="#barchan" transform="translate(214 124) scale(0.46)"/>
  <use href="#barchan" transform="translate(96 196) scale(0.4)"/>
  <use href="#barchan" transform="translate(252 46) scale(0.26)"/>

  <!-- weather mast: base plate, three legs, a thin pole whose long shadow falls east, wind cups on top -->
  <path d="M212 188 L276 200" stroke="#2a140b" stroke-width="3.5" stroke-linecap="round" opacity="0.42" filter="url(#haze)"/>
  <g stroke="#4f4640" stroke-width="3" stroke-linecap="round"><line x1="210" y1="186" x2="196" y2="196"/><line x1="210" y1="186" x2="224" y2="196"/><line x1="210" y1="186" x2="210" y2="170"/></g>
  <circle cx="210" cy="186" r="7" fill="#d9ccbc"/><circle cx="208.6" cy="184.6" r="3.4" fill="#f3eadf"/>
  <g fill="#b3a494"><circle cx="201" cy="179" r="3"/><circle cx="219" cy="179" r="3"/><circle cx="210" cy="195" r="3"/></g>
  <g stroke="#6a5f56" stroke-width="1.4"><line x1="210" y1="186" x2="201" y2="179"/><line x1="210" y1="186" x2="219" y2="179"/><line x1="210" y1="186" x2="210" y2="195"/></g>
</svg>
