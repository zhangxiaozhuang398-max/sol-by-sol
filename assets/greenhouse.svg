<svg xmlns="http://www.w3.org/2000/svg" width="280" height="220" viewBox="0 0 280 220">
  <!-- Inflatable greenhouse tunnel seen from orbit: a dusty, milky skin with plant rows showing through.
       Sun in the west (left) like in the CTX photo, shadow to the east, no drawn outlines. -->
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <radialGradient id="apron">
      <stop offset="0" stop-color="#5b3523" stop-opacity="0.45"/><stop offset="0.6" stop-color="#6e4530" stop-opacity="0.25"/><stop offset="1" stop-color="#7c5038" stop-opacity="0"/>
    </radialGradient>
    <!-- a tube lying east-west: bright along the ridge, darker down both sides -->
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7b6b" stop-opacity="0.75"/><stop offset="0.3" stop-color="#f3ebe0" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e6dccf" stop-opacity="0.22"/><stop offset="1" stop-color="#6f5a4b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="eastShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.4" stop-color="#2a140b" stop-opacity="0"/><stop offset="1" stop-color="#2a140b" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="dustLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#b9774f" stop-opacity="0"/><stop offset="1" stop-color="#b9774f" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2d5c6"/><stop offset="1" stop-color="#9c8876"/>
    </linearGradient>
    <clipPath id="tunnel"><rect x="26" y="50" width="228" height="120" rx="56"/></clipPath>
  </defs>

  <!-- trampled, darker soil around the tunnel -->
  <ellipse cx="142" cy="113" rx="140" ry="108" fill="url(#apron)"/>
  <rect x="44" y="57" width="228" height="120" rx="56" fill="#2a140b" opacity="0.45" filter="url(#blur)"/>

  <!-- floor, soil beds and plants (seen through the skin) -->
  <rect x="26" y="50" width="228" height="120" rx="56" fill="#3b2a20"/>
  <g fill="#2c4a2b">
    <rect x="62" y="68" width="156" height="18" rx="9"/><rect x="62" y="101" width="156" height="18" rx="9"/><rect x="62" y="134" width="156" height="18" rx="9"/>
  </g>
  <g fill="#4f7a45">
    <circle cx="76" cy="77" r="7.5"/><circle cx="100" cy="77" r="8.5"/><circle cx="126" cy="77" r="7.5"/><circle cx="152" cy="77" r="8.5"/><circle cx="178" cy="77" r="7.5"/><circle cx="203" cy="77" r="7.5"/>
    <circle cx="78" cy="110" r="8.5"/><circle cx="104" cy="110" r="7.5"/><circle cx="130" cy="110" r="8.5"/><circle cx="156" cy="110" r="7.5"/><circle cx="182" cy="110" r="8.5"/><circle cx="205" cy="110" r="6.5"/>
    <circle cx="76" cy="143" r="7.5"/><circle cx="102" cy="143" r="8.5"/><circle cx="128" cy="143" r="7.5"/><circle cx="154" cy="143" r="8.5"/><circle cx="180" cy="143" r="7.5"/><circle cx="204" cy="143" r="7.5"/>
  </g>
  <g fill="#7fa964">
    <circle cx="98" cy="75" r="3.5"/><circle cx="150" cy="75" r="3.5"/><circle cx="74" cy="75" r="3"/><circle cx="201" cy="75" r="3"/>
    <circle cx="128" cy="108" r="3.5"/><circle cx="180" cy="108" r="3.5"/><circle cx="76" cy="108" r="3"/>
    <circle cx="100" cy="141" r="3.5"/><circle cx="152" cy="141" r="3.5"/><circle cx="202" cy="141" r="3"/>
  </g>

  <!-- milky skin, ribs, dust and shading -->
  <rect x="26" y="50" width="228" height="120" rx="56" fill="url(#skin)"/>
  <g stroke="#e6dacb" stroke-width="2.4" opacity="0.6" clip-path="url(#tunnel)">
    <line x1="60" y1="50" x2="60" y2="170"/><line x1="92" y1="50" x2="92" y2="170"/><line x1="124" y1="50" x2="124" y2="170"/>
    <line x1="156" y1="50" x2="156" y2="170"/><line x1="188" y1="50" x2="188" y2="170"/><line x1="220" y1="50" x2="220" y2="170"/>
  </g>
  <path d="M62 84 Q140 76 220 84" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.4" filter="url(#haze)"/>
  <rect x="26" y="50" width="228" height="120" rx="56" fill="url(#dustLow)"/>
  <rect x="26" y="50" width="228" height="120" rx="56" fill="url(#eastShade)"/>
  <rect x="26.6" y="50.6" width="226.8" height="118.8" rx="55.4" fill="none" stroke="#5a4638" stroke-width="1.2" opacity="0.4"/>

  <!-- end cap and hatch on the west end -->
  <rect x="8" y="88" width="34" height="44" rx="7" fill="url(#cap)"/>
  <rect x="14" y="98" width="13" height="24" rx="4" fill="#4a433e"/>
</svg>
