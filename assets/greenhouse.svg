<svg xmlns="http://www.w3.org/2000/svg" width="280" height="220" viewBox="0 0 280 220">
  <!-- Inflatable greenhouse tunnel seen from above: clear skin, ribs, plant rows inside. -->
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafff3" stop-opacity="0.75"/><stop offset="0.35" stop-color="#bff3d2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3c7f5a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f3f8"/><stop offset="1" stop-color="#a7a3b8"/>
    </linearGradient>
  </defs>
  <rect x="26" y="50" width="228" height="120" rx="56" fill="#1a0d08" opacity="0.5" filter="url(#blur)" transform="translate(12 14)"/>
  <!-- floor + soil beds -->
  <rect x="26" y="50" width="228" height="120" rx="56" fill="#4a3526" stroke="#6f6b80" stroke-width="2.5"/>
  <g fill="#2c6b3a">
    <rect x="62" y="68" width="156" height="18" rx="9"/><rect x="62" y="101" width="156" height="18" rx="9"/><rect x="62" y="134" width="156" height="18" rx="9"/>
  </g>
  <g fill="#58c06a">
    <circle cx="76" cy="77" r="8"/><circle cx="100" cy="77" r="9"/><circle cx="126" cy="77" r="8"/><circle cx="152" cy="77" r="9"/><circle cx="178" cy="77" r="8"/><circle cx="203" cy="77" r="8"/>
    <circle cx="78" cy="110" r="9"/><circle cx="104" cy="110" r="8"/><circle cx="130" cy="110" r="9"/><circle cx="156" cy="110" r="8"/><circle cx="182" cy="110" r="9"/><circle cx="205" cy="110" r="7"/>
    <circle cx="76" cy="143" r="8"/><circle cx="102" cy="143" r="9"/><circle cx="128" cy="143" r="8"/><circle cx="154" cy="143" r="9"/><circle cx="180" cy="143" r="8"/><circle cx="204" cy="143" r="8"/>
  </g>
  <g fill="#9be28a"><circle cx="98" cy="75" r="3.5"/><circle cx="150" cy="75" r="3.5"/><circle cx="128" cy="108" r="3.5"/><circle cx="180" cy="108" r="3.5"/><circle cx="100" cy="141" r="3.5"/><circle cx="152" cy="141" r="3.5"/></g>
  <g fill="#e4553c"><circle cx="110" cy="80" r="2.6"/><circle cx="170" cy="112" r="2.6"/><circle cx="136" cy="146" r="2.6"/></g>
  <!-- clear skin with ribs -->
  <rect x="26" y="50" width="228" height="120" rx="56" fill="url(#skin)"/>
  <g stroke="#e9e4f5" stroke-width="3" opacity="0.85">
    <line x1="84" y1="52" x2="84" y2="168"/><line x1="118" y1="50" x2="118" y2="170"/><line x1="152" y1="50" x2="152" y2="170"/><line x1="186" y1="50" x2="186" y2="170"/><line x1="220" y1="56" x2="220" y2="164"/>
  </g>
  <path d="M60 66 Q140 54 222 66" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- end cap + hatch -->
  <rect x="8" y="88" width="34" height="44" rx="8" fill="url(#cap)" stroke="#6f6b80" stroke-width="2"/>
  <rect x="14" y="98" width="14" height="24" rx="4" fill="#6c5ba8"/>
</svg>
