<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Astronaut seen from above, facing the top of the picture. -->
  <defs>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="helmet" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e6e4ee"/><stop offset="1" stop-color="#a6a2b8"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/><stop offset="1" stop-color="#b9b5c9"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/><stop offset="0.5" stop-color="#e09a2e"/><stop offset="1" stop-color="#7a4a10"/>
    </linearGradient>
  </defs>
  <ellipse cx="90" cy="94" rx="46" ry="40" fill="#1a0d08" opacity="0.55" filter="url(#blur)"/>
  <!-- life-support backpack (behind) -->
  <rect x="52" y="86" width="56" height="40" rx="10" fill="#8d899e" stroke="#4a465a" stroke-width="2.5"/>
  <rect x="62" y="96" width="36" height="8" rx="4" fill="#5c586c"/>
  <circle cx="68" cy="114" r="4" fill="#4fd1c5"/><circle cx="92" cy="114" r="4" fill="#e46a3c"/>
  <!-- arms -->
  <rect x="22" y="58" width="24" height="44" rx="12" fill="url(#suit)" stroke="#6f6b80" stroke-width="2.5" transform="rotate(14 34 80)"/>
  <rect x="114" y="58" width="24" height="44" rx="12" fill="url(#suit)" stroke="#6f6b80" stroke-width="2.5" transform="rotate(-14 126 80)"/>
  <circle cx="27" cy="58" r="10" fill="#5c586c" stroke="#33303f" stroke-width="2"/>
  <circle cx="133" cy="58" r="10" fill="#5c586c" stroke="#33303f" stroke-width="2"/>
  <!-- shoulders / torso -->
  <rect x="36" y="56" width="88" height="52" rx="24" fill="url(#suit)" stroke="#6f6b80" stroke-width="2.5"/>
  <path d="M44 84 h72" stroke="#e46a3c" stroke-width="7" stroke-linecap="round"/>
  <!-- helmet -->
  <circle cx="80" cy="66" r="32" fill="url(#helmet)" stroke="#6f6b80" stroke-width="2.5"/>
  <!-- gold visor at the front (top) -->
  <path d="M54 58 a28 28 0 0 1 52 0 q-26 12 -52 0 z" fill="url(#visor)" stroke="#6b4210" stroke-width="2"/>
  <path d="M64 46 q10 -8 22 -6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <!-- helmet lamp -->
  <circle cx="80" cy="88" r="4" fill="#6f6b80"/>
</svg>
