<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Astronaut seen from above, facing the top of the picture.
       This picture turns as the astronaut walks, so it carries no shadow and its shading is the same on both
       sides; world2d.js draws the shadow on the ground, to the east like every other shadow on the map. -->
  <defs>
    <radialGradient id="helmet" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fdf8f0"/><stop offset="0.6" stop-color="#e6d9c9"/><stop offset="1" stop-color="#a99582"/>
    </radialGradient>
    <radialGradient id="suit" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#f8f1e7"/><stop offset="0.65" stop-color="#ddcfbf"/><stop offset="1" stop-color="#a5917d"/>
    </radialGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a39484"/><stop offset="1" stop-color="#75675a"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d08e"/><stop offset="0.5" stop-color="#b98232"/><stop offset="1" stop-color="#5e3d12"/>
    </linearGradient>
    <linearGradient id="dustLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#b9774f" stop-opacity="0"/><stop offset="1" stop-color="#b9774f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- life-support backpack (behind) -->
  <rect x="52" y="86" width="56" height="40" rx="9" fill="url(#pack)"/>
  <rect x="62" y="97" width="36" height="7" rx="3.5" fill="#57493f"/>
  <circle cx="68" cy="114" r="3.2" fill="#2f5c5c"/><circle cx="92" cy="114" r="3.2" fill="#b5532c"/>
  <rect x="52" y="86" width="56" height="40" rx="9" fill="url(#dustLow)"/>
  <rect x="52.8" y="86.8" width="54.4" height="38.4" rx="8.2" fill="none" stroke="#3d2e24" stroke-width="1.6" opacity="0.5"/>
  <!-- (arms, gloves and boots are drawn by world2d.js so they can swing as the astronaut walks and works) -->
  <!-- shoulders / torso -->
  <rect x="36" y="56" width="88" height="52" rx="24" fill="url(#suit)"/>
  <path d="M46 86 h68" stroke="#bf5a2e" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <rect x="36" y="56" width="88" height="52" rx="24" fill="url(#dustLow)"/>
  <rect x="36.8" y="56.8" width="86.4" height="50.4" rx="23.2" fill="none" stroke="#3d2e24" stroke-width="1.6" opacity="0.45"/>
  <!-- helmet -->
  <circle cx="80" cy="66" r="32" fill="url(#helmet)"/>
  <circle cx="80" cy="66" r="31.2" fill="none" stroke="#3d2e24" stroke-width="1.6" opacity="0.45"/>
  <!-- gold visor at the front (top) -->
  <path d="M54 58 a28 28 0 0 1 52 0 q-26 12 -52 0 z" fill="url(#visor)"/>
  <path d="M65 46 q9 -7 20 -6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- helmet lamp -->
  <circle cx="80" cy="88" r="3.6" fill="#6a5f56"/>
</svg>
