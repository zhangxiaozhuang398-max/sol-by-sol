<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <!-- Six-wheeled Mars rover seen from orbit, front at the top. Loosely modelled on Perseverance.
       Sun in the west (left) like in the CTX photo, shadow to the east, dusty surfaces, no drawn outlines. -->
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="apron">
      <stop offset="0" stop-color="#5b3523" stop-opacity="0.4"/><stop offset="0.6" stop-color="#6e4530" stop-opacity="0.2"/><stop offset="1" stop-color="#7c5038" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#efe6da"/><stop offset="0.5" stop-color="#d3c4b3"/><stop offset="1" stop-color="#9a8674"/>
    </linearGradient>
    <linearGradient id="dustLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.4" stop-color="#b9774f" stop-opacity="0.05"/><stop offset="1" stop-color="#b9774f" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="dishTop" cx="62%" cy="55%" r="75%">
      <stop offset="0" stop-color="#f3eadf"/><stop offset="1" stop-color="#a8947f"/>
    </radialGradient>
  </defs>

  <ellipse cx="102" cy="126" rx="96" ry="112" fill="url(#apron)"/>
  <g filter="url(#blur)" fill="#2a140b" opacity="0.45">
    <rect x="66" y="64" width="96" height="134" rx="12"/>
    <rect x="34" y="40" width="20" height="36" rx="7"/><rect x="172" y="40" width="20" height="36" rx="7"/>
    <rect x="178" y="113" width="20" height="36" rx="7"/><rect x="34" y="184" width="20" height="36" rx="7"/><rect x="172" y="184" width="20" height="36" rx="7"/>
  </g>

  <!-- suspension -->
  <g stroke="#4a423c" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="92" x2="34" y2="58"/><line x1="140" y1="92" x2="166" y2="58"/>
    <line x1="56" y1="130" x2="28" y2="130"/><line x1="144" y1="130" x2="172" y2="130"/>
    <line x1="60" y1="168" x2="34" y2="200"/><line x1="140" y1="168" x2="166" y2="200"/>
  </g>
  <!-- wheels: dark metal, dusty treads -->
  <g fill="#2e2a27">
    <rect x="20" y="38" width="22" height="38" rx="7"/><rect x="158" y="38" width="22" height="38" rx="7"/>
    <rect x="14" y="111" width="22" height="38" rx="7"/><rect x="164" y="111" width="22" height="38" rx="7"/>
    <rect x="20" y="182" width="22" height="38" rx="7"/><rect x="158" y="182" width="22" height="38" rx="7"/>
  </g>
  <g stroke="#7a5a48" stroke-width="1.8" opacity="0.7">
    <line x1="22" y1="48" x2="40" y2="48"/><line x1="22" y1="57" x2="40" y2="57"/><line x1="22" y1="66" x2="40" y2="66"/>
    <line x1="160" y1="48" x2="178" y2="48"/><line x1="160" y1="57" x2="178" y2="57"/><line x1="160" y1="66" x2="178" y2="66"/>
    <line x1="16" y1="121" x2="34" y2="121"/><line x1="16" y1="130" x2="34" y2="130"/><line x1="16" y1="139" x2="34" y2="139"/>
    <line x1="166" y1="121" x2="184" y2="121"/><line x1="166" y1="130" x2="184" y2="130"/><line x1="166" y1="139" x2="184" y2="139"/>
    <line x1="22" y1="192" x2="40" y2="192"/><line x1="22" y1="201" x2="40" y2="201"/><line x1="22" y1="210" x2="40" y2="210"/>
    <line x1="160" y1="192" x2="178" y2="192"/><line x1="160" y1="201" x2="178" y2="201"/><line x1="160" y1="210" x2="178" y2="210"/>
  </g>

  <!-- power unit at the back -->
  <rect x="80" y="186" width="40" height="34" rx="6" fill="#39332f"/>
  <g stroke="#5d544d" stroke-width="2"><line x1="88" y1="189" x2="88" y2="217"/><line x1="100" y1="189" x2="100" y2="217"/><line x1="112" y1="189" x2="112" y2="217"/></g>

  <!-- body deck -->
  <rect x="52" y="60" width="96" height="134" rx="11" fill="url(#deck)"/>
  <rect x="62" y="104" width="76" height="52" rx="5" fill="#c9baa9" opacity="0.75"/>
  <rect x="62" y="104" width="76" height="2" fill="#f3eadf" opacity="0.6"/>
  <rect x="52" y="60" width="96" height="134" rx="11" fill="url(#dustLow)"/>
  <rect x="52.6" y="60.6" width="94.8" height="132.8" rx="10.4" fill="none" stroke="#5a4638" stroke-width="1.2" opacity="0.4"/>

  <!-- dish antenna on the deck -->
  <circle cx="126" cy="170" r="12" fill="#2a140b" opacity="0.28"/>
  <circle cx="122" cy="168" r="12" fill="url(#dishTop)"/>
  <circle cx="122" cy="168" r="2.6" fill="#5c524a"/>
  <!-- round instrument cover -->
  <circle cx="84" cy="130" r="12" fill="#b5a593"/>
  <circle cx="82.5" cy="129" r="9" fill="#ddd0c0"/>
  <circle cx="84" cy="130" r="4" fill="#6a5f56"/>

  <!-- robotic arm and mast camera at the front -->
  <path d="M74 64 L66 32 L92 20" fill="none" stroke="#2a140b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
  <path d="M70 62 L62 30 L88 18" fill="none" stroke="#5c534b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="18" r="8.5" fill="#8a7d71"/>
  <circle cx="86.6" cy="16.8" r="4" fill="#b3a595"/>
  <rect x="116" y="67" width="26" height="22" rx="5" fill="#2a140b" opacity="0.3"/>
  <rect x="112" y="64" width="26" height="22" rx="5" fill="#463e38"/>
  <circle cx="120" cy="75" r="3.6" fill="#1f3b40"/><circle cx="131" cy="75" r="3.6" fill="#1f3b40"/>
  <circle cx="119" cy="74" r="1.2" fill="#bfe3df" opacity="0.8"/><circle cx="130" cy="74" r="1.2" fill="#bfe3df" opacity="0.8"/>
</svg>
