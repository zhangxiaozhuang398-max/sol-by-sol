<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260">
  <!-- Survey site "Layered Cliff": a small flat-topped hill (butte) whose sides show stacked rock layers, like the
       real "Kodiak" butte in Jezero, and a core drill on a tripod. An illustration, larger than life.
       Seen from above, each higher layer is a smaller shape; the sun is in the west, so every step shades its east side. -->
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <radialGradient id="apron">
      <stop offset="0" stop-color="#6e4530" stop-opacity="0.4"/><stop offset="0.7" stop-color="#6e4530" stop-opacity="0.18"/><stop offset="1" stop-color="#6e4530" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0dc" stop-opacity="0.28"/><stop offset="0.5" stop-color="#fff0dc" stop-opacity="0"/><stop offset="1" stop-color="#2a140b" stop-opacity="0.3"/>
    </linearGradient>
    <path id="blob" d="M-100 6 C-106 -38 -70 -80 -18 -88 C30 -96 84 -70 98 -22 C110 20 78 70 26 84 C-22 96 -92 60 -100 6 Z"/>
  </defs>

  <ellipse cx="150" cy="128" rx="150" ry="126" fill="url(#apron)"/>
  <use href="#blob" transform="translate(166 126) scale(1.08)" fill="#2a140b" opacity="0.45" filter="url(#blur)"/>

  <!-- five layers, bottom to top: each is drawn with a dark step on its east side, then its own colour -->
  <g transform="translate(146 122)">
    <use href="#blob" transform="scale(1.06)" fill="#a2745a"/>
    <use href="#blob" transform="translate(5 2) scale(0.87)" fill="#3a1c10" opacity="0.45" filter="url(#haze)"/>
    <use href="#blob" transform="translate(-2 -1) scale(0.86) rotate(8)" fill="#d8b294"/>
    <use href="#blob" transform="translate(3 1) scale(0.68) rotate(8)" fill="#3a1c10" opacity="0.45" filter="url(#haze)"/>
    <use href="#blob" transform="translate(-4 -2) scale(0.67) rotate(-14)" fill="#b3876b"/>
    <use href="#blob" transform="translate(1 0) scale(0.5) rotate(-14)" fill="#3a1c10" opacity="0.45" filter="url(#haze)"/>
    <use href="#blob" transform="translate(-6 -3) scale(0.49) rotate(20)" fill="#e6c4a6"/>
    <use href="#blob" transform="translate(-2 -1) scale(0.31) rotate(20)" fill="#3a1c10" opacity="0.4" filter="url(#haze)"/>
    <use href="#blob" transform="translate(-8 -4) scale(0.3) rotate(-30)" fill="#c69d80"/>
    <use href="#blob" transform="scale(1.06)" fill="url(#lit)"/>
    <!-- thin bedding lines inside the layers -->
    <g fill="none" stroke="#6b4632" stroke-width="1.2" opacity="0.4">
      <use href="#blob" transform="translate(-1 0) scale(0.96) rotate(4)"/><use href="#blob" transform="translate(-3 -1) scale(0.77) rotate(-3)"/><use href="#blob" transform="translate(-5 -2) scale(0.58) rotate(4)"/><use href="#blob" transform="translate(-7 -3) scale(0.4) rotate(-8)"/>
    </g>
  </g>

  <!-- core drill on a tripod, with a rack of sample tubes beside it -->
  <ellipse cx="226" cy="198" rx="20" ry="16" fill="#2a140b" opacity="0.4" filter="url(#haze)"/>
  <g stroke="#4f4640" stroke-width="3.4" stroke-linecap="round"><line x1="212" y1="190" x2="194" y2="202"/><line x1="212" y1="190" x2="230" y2="204"/><line x1="212" y1="190" x2="212" y2="168"/></g>
  <g fill="#7d7168"><circle cx="194" cy="202" r="4"/><circle cx="230" cy="204" r="4"/><circle cx="212" cy="168" r="4"/></g>
  <circle cx="212" cy="190" r="10" fill="#d9ccbc"/><circle cx="210.4" cy="188.4" r="6" fill="#f3eadf"/><circle cx="212" cy="190" r="3" fill="#463d37"/>
  <rect x="240" y="186" width="26" height="16" rx="3" fill="#2a140b" opacity="0.35"/>
  <rect x="236" y="183" width="26" height="16" rx="3" fill="#8c8076"/>
  <g fill="#e6dccf"><circle cx="242" cy="188" r="2.6"/><circle cx="249" cy="188" r="2.6"/><circle cx="256" cy="188" r="2.6"/><circle cx="242" cy="194" r="2.6"/><circle cx="249" cy="194" r="2.6"/></g>
</svg>
