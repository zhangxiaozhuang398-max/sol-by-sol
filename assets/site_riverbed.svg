<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260">
  <!-- Survey site "Ancient Riverbed": a dry, winding channel full of water-rounded pebbles, and a sample case.
       An illustration, larger than life. Sun in the west (left): each pebble is lit on its west side and shades its east side. -->
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <radialGradient id="fade">
      <stop offset="0.55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="soft"><ellipse cx="160" cy="130" rx="162" ry="132" fill="url(#fade)"/></mask>
    <g id="pebble">
      <ellipse cx="2.2" cy="0.8" rx="7" ry="5" fill="#2a140b" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="#8a6c5a"/>
      <ellipse cx="-1.8" cy="-1.2" rx="4" ry="2.6" fill="#c9ab95" opacity="0.8"/>
    </g>
  </defs>

  <g mask="url(#soft)">
    <!-- the channel: darker banks, a paler sandy bed, and the last thread of the stream -->
    <path d="M-10 52 C70 30 110 104 162 128 S 262 150 334 226" fill="none" stroke="#5a3826" stroke-width="74" stroke-linecap="round" opacity="0.32" filter="url(#blur)"/>
    <path d="M-10 52 C70 30 110 104 162 128 S 262 150 334 226" fill="none" stroke="#dcb594" stroke-width="50" stroke-linecap="round" opacity="0.62" filter="url(#haze)"/>
    <path d="M-10 46 C70 24 112 98 164 122 S 264 144 336 220" fill="none" stroke="#fff0dc" stroke-width="3" opacity="0.35" filter="url(#haze)"/>
    <path d="M-10 60 C68 40 106 112 158 136 S 258 158 330 234" fill="none" stroke="#3a1c10" stroke-width="3" opacity="0.3" filter="url(#haze)"/>
    <path d="M-10 54 C72 36 112 104 162 128 S 262 150 334 226" fill="none" stroke="#b08a70" stroke-width="7" stroke-dasharray="26 12 44 16" opacity="0.5"/>

    <!-- pebbles, biggest where the stream slowed down on the bends -->
    <use href="#pebble" transform="translate(30 50) rotate(20)"/><use href="#pebble" transform="translate(50 38) scale(0.7) rotate(-30)"/>
    <use href="#pebble" transform="translate(66 54) scale(1.2) rotate(60)"/><use href="#pebble" transform="translate(84 48) scale(0.6)"/>
    <use href="#pebble" transform="translate(92 70) scale(0.9) rotate(-20)"/><use href="#pebble" transform="translate(106 60) scale(0.55) rotate(40)"/>
    <use href="#pebble" transform="translate(112 90) scale(1.3) rotate(15)"/><use href="#pebble" transform="translate(128 84) scale(0.7) rotate(-50)"/>
    <use href="#pebble" transform="translate(132 110) scale(1) rotate(70)"/><use href="#pebble" transform="translate(148 104) scale(0.6) rotate(10)"/>
    <use href="#pebble" transform="translate(152 128) scale(1.15) rotate(-15)"/><use href="#pebble" transform="translate(170 118) scale(0.75) rotate(35)"/>
    <use href="#pebble" transform="translate(176 140) scale(0.9) rotate(-40)"/><use href="#pebble" transform="translate(194 128) scale(0.55) rotate(5)"/>
    <use href="#pebble" transform="translate(200 148) scale(1.25) rotate(25)"/><use href="#pebble" transform="translate(220 138) scale(0.7) rotate(-25)"/>
    <use href="#pebble" transform="translate(228 160) scale(0.95) rotate(55)"/><use href="#pebble" transform="translate(246 150) scale(0.6) rotate(-10)"/>
    <use href="#pebble" transform="translate(252 176) scale(1.1) rotate(30)"/><use href="#pebble" transform="translate(270 166) scale(0.65) rotate(-45)"/>
    <use href="#pebble" transform="translate(278 194) scale(0.9) rotate(15)"/><use href="#pebble" transform="translate(296 186) scale(0.55) rotate(60)"/>
    <use href="#pebble" transform="translate(40 66) scale(0.5) rotate(80)"/><use href="#pebble" transform="translate(140 138) scale(0.5) rotate(-70)"/>
    <use href="#pebble" transform="translate(212 164) scale(0.5) rotate(45)"/><use href="#pebble" transform="translate(120 72) scale(0.45)"/>
  </g>

  <!-- open sample case with tubes -->
  <rect x="200" y="186" width="40" height="26" rx="4" fill="#2a140b" opacity="0.4" filter="url(#haze)" transform="translate(8 3)"/>
  <rect x="198" y="184" width="40" height="26" rx="4" fill="#9c8f82"/>
  <rect x="198" y="184" width="40" height="5" rx="2.5" fill="#d9ccbc"/>
  <rect x="202" y="191" width="32" height="15" rx="2" fill="#463d37"/>
  <g fill="#e6dccf"><rect x="205" y="193" width="4.5" height="11" rx="2.2"/><rect x="212" y="193" width="4.5" height="11" rx="2.2"/><rect x="219" y="193" width="4.5" height="11" rx="2.2"/><rect x="226" y="193" width="4.5" height="11" rx="2.2"/></g>
  <circle cx="207.2" cy="195.4" r="1.5" fill="#b5532c"/><circle cx="214.2" cy="195.4" r="1.5" fill="#b5532c"/>
</svg>
