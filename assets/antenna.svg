<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- High-gain dish antenna seen from above. -->
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="dish" cx="40%" cy="36%" r="72%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#dcdae6"/><stop offset="1" stop-color="#8f8ba2"/>
    </radialGradient>
  </defs>
  <ellipse cx="124" cy="126" rx="74" ry="70" fill="#1a0d08" opacity="0.5" filter="url(#blur)"/>
  <!-- tripod base -->
  <g stroke="#5c586c" stroke-width="7" stroke-linecap="round">
    <line x1="110" y1="110" x2="38" y2="176"/><line x1="110" y1="110" x2="184" y2="172"/><line x1="110" y1="110" x2="110" y2="20"/>
  </g>
  <g fill="#8c8898" stroke="#4a465a" stroke-width="2"><circle cx="38" cy="176" r="9"/><circle cx="184" cy="172" r="9"/><circle cx="110" cy="20" r="9"/></g>
  <!-- dish -->
  <circle cx="110" cy="110" r="68" fill="url(#dish)" stroke="#6f6b80" stroke-width="2.5"/>
  <g fill="none" stroke="#9b97ad" stroke-width="1.5" opacity="0.8">
    <circle cx="110" cy="110" r="48"/><circle cx="110" cy="110" r="28"/>
    <line x1="110" y1="42" x2="110" y2="178"/><line x1="42" y1="110" x2="178" y2="110"/>
    <line x1="62" y1="62" x2="158" y2="158"/><line x1="158" y1="62" x2="62" y2="158"/>
  </g>
  <!-- feed struts + horn -->
  <g stroke="#4a465a" stroke-width="3.5" stroke-linecap="round">
    <line x1="64" y1="80" x2="110" y2="110"/><line x1="156" y1="80" x2="110" y2="110"/><line x1="110" y1="164" x2="110" y2="110"/>
  </g>
  <circle cx="110" cy="110" r="13" fill="#3a3650" stroke="#1f1c30" stroke-width="2"/>
  <circle cx="110" cy="110" r="6" fill="#4fd1c5"/>
  <path d="M66 74 a56 56 0 0 1 34 -22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
