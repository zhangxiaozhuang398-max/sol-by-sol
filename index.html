<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sol by Sol: Mars Outpost Trainer</title>
  <meta name="description" content="A browser game for kids 7-12: run a Mars outpost, explore the map, split your power, and survive real solar storms from NASA DONKI data. English and Chinese.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <!-- The look (css/themes/*.css): "jazz" by default, or what the player picked
       in Settings (saved in the browser), or ?theme=jazz|mission|cozy|classic. -->
  <link rel="stylesheet" href="css/themes/jazz.css" id="theme-css">
  <script>
    (function () {
      var looks = ["jazz", "mission", "cozy", "classic"], m = /[?&]theme=([a-z]+)/.exec(location.search), name = "jazz";
      try { name = localStorage.getItem("solbysol.theme") || name; } catch (e) { /* storage blocked */ }
      if (m) name = m[1];
      if (looks.indexOf(name) < 0) name = "jazz";
      var link = document.getElementById("theme-css");
      if (name === "classic") link.disabled = true;
      else link.href = "css/themes/" + name + ".css";
      document.documentElement.setAttribute("data-theme", name);
    })();
  </script>
</head>
<body>
  <!-- Title screen -->
  <section id="screen-title" class="screen active">
    <div class="title-card">
      <div class="title-top"><button class="btn small gear-btn" type="button" data-settings data-i18n-aria="settings.title">⚙️</button><button class="lang-toggle" data-i18n="lang.toggle" data-i18n-aria="lang.aria">中文</button></div>
      <div class="title-scene" aria-hidden="true">
        <svg viewBox="0 0 400 160">
          <circle cx="330" cy="40" r="16" class="sun"/>
          <path d="M0 120 Q100 95 200 115 T400 108 V160 H0Z" class="ground"/>
          <path d="M150 118 a40 40 0 0 1 80 0Z" class="dome"/>
          <rect x="246" y="104" width="34" height="12" rx="2" class="panel" transform="rotate(-12 263 110)"/>
          <rect x="96" y="104" width="34" height="12" rx="2" class="panel" transform="rotate(12 113 110)"/>
        </svg>
      </div>
      <h1>Sol <span>by</span> Sol</h1>
      <p class="tagline" data-i18n="title.tagline"></p>
      <ol class="how">
        <li data-i18n-html="title.how1"></li>
        <li data-i18n-html="title.how2"></li>
        <li data-i18n-html="title.how3"></li>
        <li data-i18n-html="title.how4"></li>
      </ol>
      <button id="btn-start" class="btn primary big" data-i18n="title.start"></button>
      <button id="btn-continue" class="btn big hidden" data-i18n="title.continue"></button>
      <p class="badge" data-i18n-html="title.badge"></p>
      <button id="btn-collection" class="btn ghost"><span data-i18n="title.collection"></span> <span id="collection-count"></span></button>
    </div>
  </section>

  <!-- Game screen: the Mars map fills the screen. Top left: the four supplies.
       Right: the mission, technology and calendar panels, opened from the dock.
       The panels for each of the day's four phases float over the map. -->
  <section id="screen-game" class="screen game">
    <aside class="hud-card" id="hud-card">
      <div class="brand">
        <span class="brand-planet" aria-hidden="true"></span>
        <div><div class="brand-title">Sol by Sol</div><div class="brand-sub" id="sol-label"></div></div>
      </div>
      <section class="hud" id="hud" data-i18n-aria="hud.aria"></section>
      <div class="guide hidden" id="guide" role="status" aria-live="polite"></div>
    </aside>

    <div class="rcol" id="rcol">
      <div class="world-map">
        <canvas id="minimap" width="168" height="168" data-i18n-aria="world.mapAria"></canvas>
        <div class="world-map-cap" data-i18n="world.mapCap"></div>
      </div>
      <nav class="dock" data-i18n-aria="dock.aria">
        <button class="dock-btn" type="button" data-panel="tasks"><span aria-hidden="true">🎯</span><b data-i18n="dock.tasks"></b><em id="dock-tasks"></em></button>
        <button class="dock-btn" type="button" data-panel="tech"><span aria-hidden="true">🔬</span><b data-i18n="dock.tech"></b><em id="dock-tech"></em></button>
        <button class="dock-btn" type="button" data-panel="cal"><span aria-hidden="true">📅</span><b data-i18n="dock.cal"></b><em id="dock-cal"></em></button>
      </nav>
      <section class="gpanel" id="panel-tasks" data-panel="tasks"></section>
      <section class="gpanel" id="panel-tech" data-panel="tech"></section>
      <section class="gpanel" id="panel-cal" data-panel="cal">
        <div class="gpanel-head"><h3 data-i18n="cal.title"></h3><button class="gpanel-x" type="button" data-panel-close data-i18n-aria="dock.close">✕</button></div>
        <div class="sols" id="sols" data-i18n-aria="cal.aria"></div>
        <div class="sols-legend" data-i18n="cal.legend"></div>
      </section>
    </div>

    <!-- The walkable Mars surface: a real orbital photo of Jezero crater -->
    <section class="world hidden" id="world" data-i18n-aria="world.aria">
      <div class="world-view" id="world-view"></div>
      <div class="world-top">
        <span class="world-chip" id="world-ap"></span>
        <span class="world-chip" id="world-weather"></span>
        <span class="world-chip" id="world-loc"></span>
      </div>
      <div class="world-toast" id="world-toast" aria-live="polite"></div>
      <div class="world-prompt" id="world-prompt" aria-live="polite"></div>
      <div class="joy" id="joy" aria-hidden="true"><i></i></div>
      <div class="world-keys" data-i18n-html="world.keys"></div>
      <p class="world-credit" data-i18n="world.credit"></p>
    </section>

    <header class="topbar">
      <ol class="stepper" id="stepper" data-i18n-aria="step.aria">
        <li><span>1</span><b data-i18n="step.briefing"></b></li>
        <li><span>2</span><b data-i18n="step.day"></b></li>
        <li><span>3</span><b data-i18n="step.night"></b></li>
        <li><span>4</span><b data-i18n="step.settle"></b></li>
      </ol>
      <div class="top-actions">
        <button class="btn small" id="btn-help" data-i18n="top.help"></button>
        <button class="btn small" id="btn-new" data-i18n="top.new"></button>
        <button class="btn small gear-btn" type="button" data-settings data-i18n-aria="settings.title">⚙️</button>
        <button class="lang-toggle" data-i18n="lang.toggle" data-i18n-aria="lang.aria">中文</button>
      </div>
    </header>

    <main class="panel-box stage" id="stage" aria-live="polite"></main>
    <!-- a short title card when a new phase starts (only some themes show it) -->
    <div class="phase-card" id="phase-card" aria-hidden="true"><div class="pc-bars"><i></i><i></i><i></i><i></i></div>
      <div class="pc-text"><b class="pc-sol"></b><span class="pc-phase"></span></div></div>
  </section>

  <!-- End screen -->
  <section id="screen-end" class="screen">
    <div class="end-card">
      <div class="title-top"><button class="lang-toggle" data-i18n="lang.toggle" data-i18n-aria="lang.aria">中文</button></div>
      <div id="end-hero" class="end-hero"></div>
      <div id="end-report" class="report"></div>
      <h3 data-i18n="end.chart"></h3>
      <div id="chart" class="chart"></div>
      <div id="end-stats" class="stats"></div>
      <h3 data-i18n="end.storms"></h3>
      <ul id="storm-list" class="storm-list"></ul>
      <h3 data-i18n="end.cards"></h3>
      <div id="new-cards" class="card-grid"></div>
      <div class="end-btns">
        <button id="btn-again" class="btn primary big" data-i18n="end.again"></button>
        <button id="btn-replay" class="btn" data-i18n="end.replay"></button>
        <button id="btn-home" class="btn ghost" data-i18n="end.home"></button>
      </div>
    </div>
  </section>

  <!-- Fact / help dialog -->
  <!-- "Are you sure?" inside the game: some browsers (and embedded views) block window.confirm -->
  <dialog id="ask" class="sheet small ask">
    <p id="ask-text"></p>
    <div class="ask-btns">
      <button class="btn" id="ask-no" type="button" data-i18n="ask.no"></button>
      <button class="btn primary" id="ask-yes" type="button" data-i18n="ask.yes"></button>
    </div>
  </dialog>

  <!-- The big map: the whole crater, its regions and every place (click the minimap) -->
  <dialog id="bigmap" class="sheet bigmap">
    <div class="gpanel-head"><h3 data-i18n="bigmap.title"></h3><button class="gpanel-x" type="button" data-close data-i18n-aria="dock.close">✕</button></div>
    <canvas id="bigmap-canvas" width="960" height="960" data-i18n-aria="world.mapAria"></canvas>
    <div id="bigmap-info" class="bigmap-info"></div>
    <p class="bigmap-legend" data-i18n="bigmap.legend"></p>
  </dialog>

  <dialog id="info" class="sheet small">
    <div id="info-body" class="fact-card"></div>
    <button class="btn primary" data-close data-i18n="info.gotIt"></button>
  </dialog>

  <!-- Settings: sound and volumes, and the look of the game -->
  <dialog id="settings" class="sheet small settings">
    <h2>⚙️ <span data-i18n="settings.title"></span></h2>
    <section class="set-group">
      <h3 data-i18n="settings.sound"></h3>
      <label class="set-switch"><input type="checkbox" id="set-sound"><span data-i18n="settings.soundOn"></span></label>
      <label class="set-row"><span data-i18n="mixer.music"></span><input type="range" min="0" max="100" step="1" data-level="music"><output></output></label>
      <label class="set-row"><span data-i18n="mixer.ambient"></span><input type="range" min="0" max="100" step="1" data-level="ambient"><output></output></label>
      <label class="set-row"><span data-i18n="mixer.effects"></span><input type="range" min="0" max="100" step="1" data-level="effects"><output></output></label>
      <p class="set-note" data-i18n="mixer.note"></p>
    </section>
    <section class="set-group">
      <h3 data-i18n="settings.look"></h3>
      <div class="looks" role="radiogroup" data-i18n-aria="settings.look">
        <button type="button" class="look" data-look="jazz" role="radio"><i class="sw sw-jazz"></i><b data-i18n="look.jazz"></b><small data-i18n="look.jazz.d"></small></button>
        <button type="button" class="look" data-look="mission" role="radio"><i class="sw sw-mission"></i><b data-i18n="look.mission"></b><small data-i18n="look.mission.d"></small></button>
        <button type="button" class="look" data-look="cozy" role="radio"><i class="sw sw-cozy"></i><b data-i18n="look.cozy"></b><small data-i18n="look.cozy.d"></small></button>
        <button type="button" class="look" data-look="classic" role="radio"><i class="sw sw-classic"></i><b data-i18n="look.classic"></b><small data-i18n="look.classic.d"></small></button>
      </div>
    </section>
    <button class="btn primary" data-close data-i18n="settings.done"></button>
  </dialog>

  <!-- Collection dialog -->
  <dialog id="collection" class="sheet">
    <h2 data-i18n="collection.title"></h2>
    <p class="note" data-i18n="collection.note"></p>
    <div id="collection-grid" class="card-grid"></div>
    <button class="btn primary" data-close data-i18n="collection.close"></button>
  </dialog>

  <footer class="footer" data-i18n-html="footer"></footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
